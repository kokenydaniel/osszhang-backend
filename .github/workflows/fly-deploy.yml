# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure persistent storage volume
        run: |
          if ! flyctl volumes list -a osszhang-backend 2>/dev/null | grep -q 'osszhang_private_storage'; then
            flyctl volumes create osszhang_private_storage -a osszhang-backend -r fra -s 1 -y
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: flyctl deploy --remote-only -a osszhang-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
