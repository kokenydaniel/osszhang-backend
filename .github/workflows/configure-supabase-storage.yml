# Egyszeri / ismételt: Supabase S3 kulcsok → Fly secrets (osszhang-backend).
# GitHub repo secrets (penzpilot-backend):
#   SUPABASE_STORAGE_ACCESS_KEY, SUPABASE_STORAGE_SECRET_KEY
# Opcionális: SUPABASE_STORAGE_BUCKET (default: attachments)

name: Configure Supabase Storage
on:
  workflow_dispatch:

jobs:
  sync-fly-secrets:
    name: Sync storage secrets to Fly
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Apply Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          ACCESS_KEY: ${{ secrets.SUPABASE_STORAGE_ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SUPABASE_STORAGE_SECRET_KEY }}
          BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${ACCESS_KEY:-}" ] || [ -z "${SECRET_KEY:-}" ]; then
            echo "::error::Hiányzik a SUPABASE_STORAGE_ACCESS_KEY vagy SUPABASE_STORAGE_SECRET_KEY GitHub secret."
            echo "Supabase → Storage → S3 Access Keys → új kulcs, majd:"
            echo "  gh secret set SUPABASE_STORAGE_ACCESS_KEY -R kokenydaniel/penzpilot-backend"
            echo "  gh secret set SUPABASE_STORAGE_SECRET_KEY -R kokenydaniel/penzpilot-backend"
            exit 1
          fi
          BUCKET_NAME="${BUCKET:-attachments}"
          flyctl secrets set -a osszhang-backend \
            FILESYSTEM_DISK=s3 \
            SUPABASE_STORAGE_BUCKET="${BUCKET_NAME}" \
            SUPABASE_STORAGE_ENDPOINT=https://fpdbwoqlhhwjdetzlbit.storage.supabase.co/storage/v1/s3 \
            SUPABASE_STORAGE_REGION=eu-central-1 \
            SUPABASE_STORAGE_USE_PATH_STYLE=true \
            SUPABASE_STORAGE_ACCESS_KEY="${ACCESS_KEY}" \
            SUPABASE_STORAGE_SECRET_KEY="${SECRET_KEY}"

      - name: Redeploy backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --yes --ha=false -a osszhang-backend
